<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM getElementsByClassName</title>
    <style>
        #p1{
            color: green;
            font-size: 20px;
        }
    </style>
    <script>
        function g1(){
            var z=document.getElementsByClassName("xyz");
            alert("length: "+z.length)
            alert(z[0].innerHTML);
        }
    </script>
</head>
<body>
    <p id="p1">Hello BVB</p>
    <p name="CS">Welcome to SOCSE</p>
    <p name="CS">Welcome to KLE TECH</p>
    <p class="xyz">Hello BVB</p>
    <p id="p2">Hello!! </p>
    <input type="button" value="clickMe" onclick="g1()">
</body>
</html>
