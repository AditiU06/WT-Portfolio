<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Specificity</title>
    <style>
        /* Specificity=1 1st preference element selector*/
        h1{
            color :blue;
        }
        /* Specificity=100 2nd pref*/
        #a1{
            text-align: center;
        }
        /* Specificity=10 3rd pref*/
        .yellow{
            color: yellow;
        }
        /* Specificity=10 */
        .cpurple{
            color: purple;
        }
        /* Specificity=10 */
        .cred{
            color: red;
        }
        /* Specificity=10 Least one is considered normally*/ 
        /* Attribute selector last pref*/
        [data-x=a]{
            color: blueviolet;
        }
        h1.yellow{
            color: darkgreen;
        }
        /* style="color: aqua;" in <h1>: color */ 
        /*Highest specificity considered */
    </style>
</head>
<body>
    <h1  id="a1" class=" yellow cpurple cred" data-x="a">CSS</h1>
</body>
</html>
