<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=">
    <title>Overflow</title>
    <style>
        .box {
            width: 10vw;
            height: 10vh;
            border: 2px solid black;
            /* overflow: auto; */
            overflow-x: scroll;
            overflow-y: hidden;
            /*show scroll bar only if it overflows-auto, scroll-whether overflow or not show scroll bar, in one line no vertical- whitespace:no wrap*/
        }
    </style>
</head>

<body>
    <div class="box">
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Minima nesciunt adipisci libero dignissimos modi
        provident voluptatum dicta velit earum enim sit itaque exercitationem, tempore doloremque hic sapiente beatae.
        Distinctio, maxime.
    </div>
</body>

</html>
