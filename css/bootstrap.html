<!DOCTYPE html>
<html>
<head>
    <title>Faculty Details</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: lavender; font-family: Arial;">

<div class="container mt-4">

    <h2 id="heading"></h2>

    <p>Please fill in the faculty member’s details below.</p>

    <form>

        <!-- Floating Label with Tooltip -->
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="fname"
            placeholder="First Name"
            data-bs-toggle="tooltip"
            title="Enter the faculty member's first name">
            <label for="fname">First Name</label>
        </div>

        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="lname"
            placeholder="Last Name"
            data-bs-toggle="tooltip"
            title="Enter the faculty member's last name">
            <label for="lname">Last Name</label>
        </div>

        Age:<br>
        <input class="form-check-input" type="radio" name="age"> Below 30
        <input class="form-check-input" type="radio" name="age"> 30-50
        <input class="form-check-input" type="radio" name="age"> Above 50
        <br><br>

        Designation:<br>
        <input class="form-check-input" type="radio" name="des"> Librarian
        <input class="form-check-input" type="radio" name="des"> Assistant
        <input class="form-check-input" type="radio" name="des"> Chief Librarian
        <br><br>

        Subjects:<br>
        <input class="form-check-input" type="checkbox"> Web Technology
        <input class="form-check-input" type="checkbox"> DBMS
        <input class="form-check-input" type="checkbox"> OS
        <br><br>

        <button class="btn btn-primary">Submit</button>
        <button class="btn btn-secondary">Reset</button>

    </form>

    <br>
    <a href="index.html" class="btn btn-outline-dark">⬅ Back to Home</a>

</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name");

    document.getElementById("heading").innerText =
        "Faculty Details - " + name;

    // Activate Bootstrap tooltips
    const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
    const tooltipList = [...tooltipTriggerList].map(el => new bootstrap.Tooltip(el))
</script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
