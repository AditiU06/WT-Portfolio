<html>
    <head>
        <title>Popup Demo</title>
    </head>
    <body>
        <script type="text/javascript">
            document.write("<h2 style='color:red;'> Hello World!!! </h2>");
            alert("Welcome to Popup!!!!!!!!");
            var x=confirm("Do u want to continue?");
            document.write("x= "+x);
            var y=prompt("Enter Value");
            var z=prompt("Enter Value");
            y=parseInt(y);
            z=parseInt(z);
            k=y+z;
            document.write("<br>Sum = "+k);

            function func(){
                alert("Hello!!");
                alert("How r u?");
            }
        </script>
        <h3>Event Demo</h3>
        <button onclick="func()">Click here</button>
    </body>
</html>
