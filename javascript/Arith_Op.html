<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmatic Operations</title>
    <script type="text/javascript">
        function add(){
            var a=document.Myform.first.value;
            var b=document.Myform.second.value;
            a=parseFloat(a);
            b=parseFloat(b);
            var res=a+b;
            document.Myform.result.value=res;
        }
         function sub(){
            var a=document.Myform.first.value;
            var b=document.Myform.second.value;
            a=parseFloat(a);
            b=parseFloat(b);
            var res=a-b;
            document.Myform.result.value=res;
        }
         function mul(){
            var a=document.Myform.first.value;
            var b=document.Myform.second.value;
            a=parseFloat(a);
            b=parseFloat(b);
            var res=a*b;
            document.Myform.result.value=res;
        }
         function div(){
            var a=document.Myform.first.value;
            var b=document.Myform.second.value;
            a=parseFloat(a);
            b=parseFloat(b);
            var res=a/b;
            document.Myform.result.value=res;
        }
    </script>
</head>
<body>
    <form style="text-align: center;" name="Myform">
        <h1>Arithmatic Operations</h1>
        <hr color="red">
        <h4 style="text-decoration: underline;">Enter a num in each text box</h4>
        Number 1: <input type="text" name="first"><br><br>
        Number 2: <input type="text" name="second"><br><br>
        <input type="button" onclick="add()" value="Add"></input>
        <input type="button" onclick="sub()" value="Subtract"></input>
        <input type="button" onclick="mul()" value="Multiply"></input>
        <input type="button" onclick="div()" value="Divide"></input>
        <h4 style="color:red;"> Result is: <input type="text" name="result" value="">
    </form>
</body>
</html>
