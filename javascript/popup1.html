<html>
    <head><title>
        Retrive Text
    </title></head>
    <body>
        <h3>Retriving of Text:</h3>
        <form name="x1">
            <input type="text" name="x2"/> <br><br>
            <input type="button" value="SUBMIT" onclick="func()"/>
