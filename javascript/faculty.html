<!DOCTYPE html>
<html>
<head>
    <title>Faculty Details</title>
</head>

<body style="background-color: lavender; font-family: Arial;">

    <h2 id="heading"></h2>

    <form>

        First Name:
        <input type="text"><br><br>

        Last Name:
        <input type="text"><br><br>

        Age:<br>
        <input type="radio" name="age"> Below 30
        <input type="radio" name="age"> 30-50
        <input type="radio" name="age"> Above 50
        <br><br>

        Designation:<br>
        <input type="radio" name="des"> Librarian
        <input type="radio" name="des"> Assistant
        <input type="radio" name="des"> Chief Librarian
        <br><br>

        Subjects:<br>
        <input type="checkbox"> Web Technology
        <input type="checkbox"> DBMS
        <input type="checkbox"> OS
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

    <br>
    <a href="index.html">⬅ Back to Home</a>

    <script>
        const params = new URLSearchParams(window.location.search);
        const name = params.get("name");
        document.getElementById("heading").innerText = 
            "Faculty Details - " + name;
    </script>

</body>
</html>
