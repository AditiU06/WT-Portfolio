<html>
<head>
    <title>Hello World example</title>
</head>
<body style="color:slateblue">
    <script type="text/javascript">
       var name="Pookie Aprameya";
       var age=200;

      //MATH OPERATIONS
       var x=4.7;
       var y=4.1;
       let result=Math.pow(Math.floor(Math.sqrt(50)),3);
       document.write("<h1 style='color:darkred;'>Hello, world!</h1>");
       document.write("<h2 style='color:darkgreen'>Age of "+name+" is "+age+"</h1>");
       document.write("<h1>"+Math.round(x)+"</h1>");
       document.write("<h1>"+Math.round(y)+"</h1>");
       document.write("<h1>"+Math.floor(x)+"</h1>");
       document.write("<h1>"+Math.ceil(x)+"</h1>");
       document.write("<h1>"+Math.max(x,y)+"</h1>");
       document.write("<h1>"+Math.min(x,y)+"</h1>");
       document.write("<h1>"+Math.sqrt(4)+"</h1>");
       document.write("<h1>"+Math.pow(4,2)+"</h1>");
       document.write("<h1> Result = "+result+"</h1>");
       document.write("<h1>"+Math.PI+"</h1>");
       document.write("<h1>Number() : "+Math.E+"</h1>");
       let num=Number("123");
       document.write("<h1>Number() : "+num+"</h1>");
       let invalidNum=Number("abc");
       document.write("<h1>Invalid num : "+invalidNum+"</h1>");
       let intNum=parseInt("42.7");
       document.write("<h1>parseInt() : "+intNum+"</h1>");
       let floatNum=parseFloat("42.7");
       document.write("<h1>parseFloat() : "+floatNum+"</h1>");
       let rounded=3.14159.toFixed(2);
       document.write("<h1>rounded() : "+rounded+"</h1>");
       let res1="5"+2;
       document.write("<h1> Result = "+res1+"</h1>");
       let res2="5"-2;
       document.write("<h1> Result = "+res2+"</h1>");
       var sum=0;

      //FOR LOOP
       for(var i=0;i<100;i++)
       {sum=sum+i;}
       document.write("<h1>Sum="+sum+"</h1>");
       var s1="hello";
       var s2="";
       for(var i=0;i<s1.length;i++)
       {s2+=s1.charAt(i)+s1.charAt(i);}
       document.write("<h1>S2 stores "+s2+"</h1>");

       //ARRAYS
       var ducks=["Huey","Dewey","Louie"]; //normal array
       var stooges=[]; //empty array
       document.write("<h1>Array of ducks : "+ducks+"</h1>");
       document.write("<h1>Stooges length: "+stooges.length+"</h1>");
       stooges[0]="Larry";
       document.write("<h1>Larry length: "+stooges.length+"</h1>");
       stooges[1]="Moe";
       document.write("<h1>Moe length: "+stooges.length+"</h1>");
       stooges[4]="Curry";
       document.write("<h1>Curry length: "+stooges.length+"</h1>");
       stooges[4]="Sheep";
       document.write("<h1>Sheep length: "+stooges.length+"</h1>");
       document.write("<h1>Array of stooges : "+stooges+"</h1>"); //two 4,so such output
       document.write("<h1>Length: "+stooges.length+"</h1>");

       //SUBSTRING
       var s="Web Technology";
       var fname=s.substring(0,s.indexOf(" ")); //index of space- 3,so from 0-3(but 3-1=2),so 0-2
       var len=s.length;
       document.write("<h1>Initial name= "+s+"<br>Fname="+fname+"<br>Length= "+len+"</h1>");

       //SPLITTING STRINGS:JOIN AND SPLIT
       var s="the quick brown for";
       document.write("<h1>String= "+s+"</h1>");
       var a=s.split(" ");
       document.write("<h1>String to array using split= "+a+"</h1>");
       a.reverse();
       document.write("<h1>Array reverse= "+a+"</h1>");
       a=a.join("!");
       document.write("<h1>Array to String using join= "+a+"</h1>");
    </script>
</body>
</html>
