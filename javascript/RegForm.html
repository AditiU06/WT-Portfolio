<html>
    <head>
        <meta charset="utf-8">
        <title>Registration Form</title>
        <script src="Rf.js"></script>
    </head>
    <body onload="document.registration.userid.focus();">
        <h1>Registration Form</h1>
        <form name='registration' onSubmit="return formValidation();">
            <li><label for="userid">User ID</label></li>
            <li><input type="text" name="userid" size="12" /></li>
            <li><label for="passid">Password</label></li>
            <li><input type="password" name="passid" size="12" /></li>
            <li><label for="name">Name</label></li>
            <li><input type="text" name="name" size="50" /></li>
            <li><label for="address">Address</label></li>
            <li><input type="text" name="address" size="50" /></li>
            <li><label for="country">Country</label></li>
            <li><select name="country">
            <option selected="" value="Default">(Please select a country)</option>
            <option value="AF">Australia</option>
            <option value="IN">India</option>
            <option value="JP">Japan</option>
            <option value="SK">South Korea</option>
            <option value="CA">Canada</option>
            </select></li>
            <li><label for="zip">ZIP Code</label></li>
            <li><input type="text" name="zip" /></li>
            <li><label for="email">E-mail</label></li>
            <li><input type="text" name="email" size="50" /></li>
            <li><label for="gender">Gender</label></li>
            <li><input type="radio" name="gen" value="Male"/>
            <span>Male</span></li>
            <li><input type="radio" name="gen" value="Female"/>
            <span>Female</span></li>
            <li><label>Language</label></li>
            <li><input type="checkbox" name="en" value="en" checked />
            <span>English</span></li>
            <li><input type="checkbox" name="noen" value="noen" />
            <span>Non-English</span></li>
            <li><input type="submit" value="SUBMIT" /></li>
        </form>

    </body>
</html>
